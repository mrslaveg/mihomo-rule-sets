name: Build MRS

on:
  push:
    paths:
      - 'direct.txt'
      - 'proxy.txt'
      - 'games.txt'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Mihomo
        shell: bash
        run: |
          set -euo pipefail

          URL=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest |
            jq -r '
              .assets[]
              | select(.name | test("^mihomo-linux-amd64-v1\\.[0-9]+\\.[0-9]+\\.gz$"))
              | .browser_download_url
            ' | head -n1)

          if [ -z "$URL" ]; then
            echo "ERROR: Mihomo linux-amd64-v1 release asset not found"
            exit 1
          fi

          echo "Downloading: $URL"
          curl -fL "$URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo

          ./mihomo -v

      - name: Build MRS
        shell: bash
        run: |
          set -euo pipefail

          ./mihomo convert-ruleset domain text direct.txt direct.mrs
          ./mihomo convert-ruleset domain text proxy.txt proxy.mrs

          ls -lh direct.mrs proxy.mrs

      - name: Commit MRS
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add direct.mrs proxy.mrs

          if git diff --cached --quiet; then
            echo "No MRS changes"
            exit 0
          fi

          git commit -m "Update MRS"
          git push
