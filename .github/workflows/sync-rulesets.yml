name: Sync specific rulesets

on:
  schedule:
    - cron: '0 3 * * *'   # каждый день в 03:00 UTC
  workflow_dispatch:       # позволяет запускать вручную с вкладки Actions

permissions:
  contents: write          # нужно, чтобы бот мог пушить коммиты

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v5

      - name: Download only the two files
        run: |
          mkdir -p rules
          curl -fsSL -o rules/geosite-ru.mrs \
            "https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/rules/category-ru.mrs"
          curl -fsSL -o rules/geoip-ru.mrs \
            "https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/ip-for-ru/lists/ips-for-ru.mrs"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync rulesets from upstream"
            git push
          else
            echo "No changes to commit"
          fi
